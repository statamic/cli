name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        env:
          STABILITY: ${{ matrix.stability }}
        run: composer update --"$STABILITY" --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  php-tests-result:
    name: PHP tests
    runs-on: ubuntu-latest
    needs: [php-tests]
    if: always()
    permissions: {}

    steps:
      - name: Fail if any job failed
        if: needs.php-tests.result != 'success' && needs.php-tests.result != 'skipped'
        run: exit 1
